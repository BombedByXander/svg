name: Refresh jsDelivr branch cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep the stable latest alias synced with main
        env:
          AFTER_SHA: ${{ github.sha }}
        run: git push origin "$AFTER_SHA:refs/heads/latest" --force
      - name: Publish a patch version for the stable @latest URL
        env:
          AFTER_SHA: ${{ github.sha }}
        run: |
          existing=$(git tag --points-at "$AFTER_SHA" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [[ -n "$existing" ]]; then
            echo "Commit already has release tag $existing"
            exit 0
          fi
          latest=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          IFS=. read -r major minor patch <<< "$latest"
          next="$major.$minor.$((patch + 1))"
          while git ls-remote --exit-code --tags origin "refs/tags/$next" >/dev/null 2>&1; do
            patch=$((patch + 1))
            next="$major.$minor.$patch"
          done
          git tag "$next" "$AFTER_SHA"
          git push origin "refs/tags/$next"
          echo "Published $next for $AFTER_SHA"
      - name: Purge changed files from jsDelivr
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            files=$(git ls-files)
          else
            files=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          fi
          files=$(printf '%s\n' index.svg b/index.svg b/index.html b/favicon.svg b/assets/blueberry.svg b/assets/berri-home.css b/assets/bundle-berri-20261017.js "$files" | sort -u)
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe="/"))' "$file")
            url="https://purge.jsdelivr.net/gh/BombedByXander/svg@main/$encoded"
            echo "Purging $file"
            for attempt in {1..8}; do
              response=$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$url")
              echo "$response"
              result=$(python3 -c 'import json,sys; d=json.load(sys.stdin); item=next(iter(d.get("paths", d.get("files",{})).values()),{}); print("throttled" if item.get("throttled") is True else "ok" if "throttled" in item else "invalid"); print(int(item.get("throttlingReset",0)))' <<< "$response")
              state=$(sed -n '1p' <<< "$result")
              reset_ms=$(sed -n '2p' <<< "$result")
              if [[ "$state" == "ok" ]]; then
                break
              fi
              if [[ "$state" != "throttled" || "$attempt" == 8 ]]; then
                echo "Purge failed for $file (state: $state)" >&2
                exit 1
              fi
              delay=$(( (reset_ms + 999) / 1000 + 1 ))
              echo "Purge throttled; retrying $file in ${delay}s (attempt $attempt/8)"
              sleep "$delay"
            done
            latest_url="https://purge.jsdelivr.net/gh/BombedByXander/svg@latest/$encoded"
            echo "Purging $latest_url"
            for attempt in {1..8}; do
              response=$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$latest_url")
              echo "$response"
              result=$(python3 -c 'import json,sys; d=json.load(sys.stdin); item=next(iter(d.get("paths", d.get("files",{})).values()),{}); print("throttled" if item.get("throttled") is True else "ok" if "throttled" in item else "invalid"); print(int(item.get("throttlingReset",0)))' <<< "$response")
              state=$(sed -n '1p' <<< "$result")
              reset_ms=$(sed -n '2p' <<< "$result")
              if [[ "$state" == "ok" ]]; then
                break
              fi
              if [[ "$state" != "throttled" || "$attempt" == 8 ]]; then
                echo "Latest alias purge failed for $file (state: $state)" >&2
                exit 1
              fi
              delay=$(( (reset_ms + 999) / 1000 + 1 ))
              echo "Latest alias purge throttled; retrying $file in ${delay}s (attempt $attempt/8)"
              sleep "$delay"
            done
          done <<< "$files"
