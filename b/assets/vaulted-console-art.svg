<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-label="Vaulted console artwork">
  <defs>
    <pattern id="pixels" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect x="0" y="0" width="18" height="18" fill="#102cff"/>
      <rect x="18" y="18" width="18" height="18" fill="#102cff"/>
      <rect x="36" y="36" width="18" height="18" fill="#102cff"/>
      <rect x="54" y="54" width="18" height="18" fill="#102cff"/>
      <rect x="72" y="72" width="18" height="18" fill="#102cff"/>
      <rect x="90" y="90" width="18" height="18" fill="#102cff"/>
    </pattern>
    <filter id="red-glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="520" height="280" rx="8" fill="#05060c"/>
  <rect width="520" height="280" fill="url(#pixels)"/>
  <rect x="22" y="80" width="476" height="120" fill="#05060c" fill-opacity=".94"/>
  <text x="260" y="158" text-anchor="middle" font-family="monospace" font-size="64" font-weight="700" letter-spacing="-5" fill="none" stroke="#ff1d35" stroke-width="2" filter="url(#red-glow)">VAULTED</text>
</svg>
