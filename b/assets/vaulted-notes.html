<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaulted Notes</title>
<style>
:root{color-scheme:dark;--bg-base:#10070b;--bg-1-base:#170a10;--bg-2-base:#210e17;--bg-3-base:#2c1420;--bg-4-base:#381a29;--accent:#e8798f;--accent-2:#bd526c;--text:#f0dce2;--text-muted:#ad8793;--bright-text:#fff7f9;--border:#f6bfd038;--border-2:#f6bfd024;--border-3:#f6bfd017;--border-4:#f6bfd00d;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg-base);color:var(--text);height:100dvh;overflow:hidden}.app{height:100%;display:grid;grid-template-columns:190px 300px minmax(0,1fr);background:var(--bg-base)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.folders{padding:24px 12px;border-right:1px solid var(--border-2);background:var(--bg-1-base)}.brand{font-size:16px;font-weight:750;color:var(--bright-text);letter-spacing:-.03em;margin:0 10px 26px}.brand span{color:var(--accent)}.folder{display:flex;width:100%;gap:10px;align-items:center;padding:10px;border:0;border-radius:9px;background:transparent;text-align:left;color:var(--text-muted)}.folder.active,.folder:hover{background:var(--bg-3-base);color:var(--bright-text)}.folder .count{margin-left:auto;color:var(--text-muted);font-size:12px}.list{min-width:0;border-right:1px solid var(--border-2);display:flex;flex-direction:column}.list-head{padding:24px 18px 14px}.list-head h1{font-size:22px;color:var(--bright-text);margin:0 0 15px;letter-spacing:-.04em}.search{display:flex;gap:8px;align-items:center;background:var(--bg-2-base);border:1px solid var(--border-2);border-radius:10px;padding:0 11px}.search input{width:100%;height:38px;border:0;outline:0;background:transparent}.new{width:100%;margin-top:10px;border:0;border-radius:9px;padding:10px;background:var(--accent);color:#211016;font-weight:700}.note-list{overflow:auto;padding:4px 10px 18px}.note-row{position:relative;padding:12px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--border-2)}.note-row:hover,.note-row.selected{background:var(--bg-2-base)}.note-row.selected{box-shadow:inset 3px 0 var(--accent)}.note-row strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--bright-text);font-size:14px}.note-row time,.note-row p{display:block;margin:4px 0 0;font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.editor{min-width:0;display:flex;flex-direction:column}.editor-head{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border-2);color:var(--text-muted);font-size:12px}.editor-head .actions{display:flex;gap:8px}.iconbtn{border:1px solid var(--border-2);border-radius:8px;background:var(--bg-2-base);padding:7px 10px}.iconbtn:hover{color:var(--accent);border-color:var(--accent)}.toolbar{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--border-2);background:var(--bg-base)}.tool-group{display:flex;flex-direction:column;gap:5px;padding:6px 8px;border:1px solid var(--border-2);border-radius:11px;background:var(--bg-1-base)}.tool-label{padding:0 3px;color:var(--text-muted);font-size:9px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.tool-controls{display:flex;align-items:center;gap:3px}.toolbar button,.toolbar select{height:34px;min-width:36px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--text);padding:0 9px;transition:background .15s,border-color .15s,color .15s,box-shadow .15s}.toolbar button{font-size:13px;font-weight:600}.toolbar button:hover,.toolbar select:hover{background:var(--bg-3-base);border-color:var(--border)}.toolbar button.active,.toolbar button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 22%,var(--bg-3-base));border-color:var(--accent);color:var(--bright-text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 30%,transparent),0 0 0 2px color-mix(in srgb,var(--accent) 16%,transparent)}.toolbar button:focus-visible,.toolbar select:focus-visible,.color-tool:focus-within{outline:2px solid var(--accent);outline-offset:2px}.color-tool{height:34px;display:flex;align-items:center;gap:7px;padding:0 8px;border:1px solid var(--border-2);border-radius:8px;color:var(--text);font-size:11px;cursor:pointer}.color-tool:hover{border-color:var(--accent);background:var(--bg-3-base)}.toolbar input[type=color]{width:22px;height:22px;border:1px solid var(--border);border-radius:5px;background:none;padding:1px;cursor:pointer}.paper{overflow:auto;flex:1;padding:35px clamp(24px,8vw,110px) 70px}.title{width:100%;border:0;outline:0;background:transparent;color:var(--bright-text);font-size:30px;font-weight:750;letter-spacing:-.04em;margin:0 0 18px}.body{min-height:calc(100% - 60px);outline:0;color:var(--text);font-size:15px;line-height:1.75;overflow-wrap:anywhere}.body:empty:before{content:"Start writing…";color:var(--text-muted);pointer-events:none}.body ul,.body ol{padding-left:1.5em}.body h1{font-size:28px;line-height:1.2;color:var(--bright-text)}.body h2{font-size:21px;line-height:1.25;color:var(--bright-text)}.body h3{font-size:17px;line-height:1.3;color:var(--bright-text)}.body table{width:100%;border-collapse:collapse;margin:14px 0}.body td,.body th{border:1px solid var(--border);padding:8px;min-width:60px}.body th{background:var(--bg-2-base)}.dash-list{list-style:none;padding-left:18px}.dash-list li:before{content:"– ";margin-left:-18px}.task{display:flex;align-items:baseline;gap:8px}.task input{accent-color:var(--accent)}mark{color:#211016;border-radius:3px;padding:0 2px}.empty{margin:30px 10px;text-align:center;color:var(--text-muted);font-size:13px}.status{padding:8px 24px;border-top:1px solid var(--border-2);font-size:11px;color:var(--text-muted)}@media(max-width:760px){.app{grid-template-columns:58px 190px minmax(0,1fr)}.folders{padding:18px 6px}.brand{font-size:0;margin:8px}.brand span{font-size:17px}.folder{justify-content:center;padding:11px 2px;font-size:0}.folder .count{display:none}.list-head{padding:16px 10px 10px}.list-head h1{font-size:18px}.list-head .search input{font-size:12px}.paper{padding:24px 18px}.title{font-size:25px}.toolbar{padding:8px;gap:6px;align-items:stretch}.tool-group{padding:5px;flex:1 1 auto;min-width:0}.tool-controls{flex-wrap:wrap}.toolbar button{padding:0 7px;min-width:32px}}
</style>
</head>
<body>
<div class="app">
<aside class="folders"><p class="brand">Vaulted <span>Notes</span></p><button class="folder active" id="allFolder"><span>▤</span> Notes <span class="count" id="noteCount">0</span></button><button class="folder" id="pinnedFolder"><span>☆</span> Pinned <span class="count" id="pinnedCount">0</span></button></aside>
<section class="list"><header class="list-head"><h1>Notes</h1><label class="search"><span>⌕</span><input id="search" placeholder="Search all notes" aria-label="Search notes"></label><button class="new" id="newNote">＋ New Note</button></header><div class="note-list" id="noteList"></div></section>
<main class="editor"><header class="editor-head"><span id="saveStatus">Vaulted Notes</span><div class="actions"><button class="iconbtn" id="pinNote" title="Pin note">☆</button><button class="iconbtn" id="deleteNote" title="Delete note">Delete</button></div></header>
<div class="toolbar" role="toolbar" aria-label="Note formatting">
<div class="tool-group" aria-label="Text style"><span class="tool-label">Style</span><div class="tool-controls"><select id="format" aria-label="Text style"><option value="p">Body</option><option value="h1">Title</option><option value="h2">Heading</option><option value="h3">Subheading</option></select></div></div>
<div class="tool-group" aria-label="Text formatting"><span class="tool-label">Text</span><div class="tool-controls"><button type="button" data-cmd="bold" title="Bold" aria-label="Bold" aria-pressed="false"><b>B</b></button><button type="button" data-cmd="italic" title="Italic" aria-label="Italic" aria-pressed="false"><i>I</i></button><button type="button" data-cmd="underline" title="Underline" aria-label="Underline" aria-pressed="false"><u>U</u></button><button type="button" data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough" aria-pressed="false"><s>S</s></button><label class="color-tool" title="Highlight color"><span>Highlight</span><input id="highlightColor" type="color" value="#fff176" aria-label="Highlight color"></label></div></div>
<div class="tool-group" aria-label="Lists and table"><span class="tool-label">Lists &amp; table</span><div class="tool-controls"><button type="button" data-cmd="insertUnorderedList" title="Bulleted list" aria-pressed="false">• Bullets</button><button type="button" id="dashList" title="Dash list" aria-pressed="false">– Dashes</button><button type="button" data-cmd="insertOrderedList" title="Numbered list" aria-pressed="false">1. Numbered</button><button type="button" id="checkList" title="Checklist" aria-pressed="false">☑ Checklist</button><button type="button" id="table" title="Insert table" aria-pressed="false">▦ Table</button></div></div>
<div class="tool-group" aria-label="Alignment and cleanup"><span class="tool-label">Align</span><div class="tool-controls"><button type="button" data-cmd="justifyLeft" title="Align left" aria-label="Align left" aria-pressed="false">⇤</button><button type="button" data-cmd="justifyCenter" title="Center" aria-label="Center" aria-pressed="false">≡</button><button type="button" data-cmd="justifyRight" title="Align right" aria-label="Align right" aria-pressed="false">⇥</button><button type="button" data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting">Tx</button></div></div>
</div><section class="paper"><input class="title" id="noteTitle" placeholder="New Note" maxlength="160" aria-label="Note title"><div class="body" id="noteBody" contenteditable="true" spellcheck="true"></div></section><footer class="status" id="statusLine">Saved on this device · separated by signed-in account</footer></main>
</div>
<script>
(()=>{const EDITOR=document.getElementById('noteBody'),TITLE=document.getElementById('noteTitle'),LIST=document.getElementById('noteList'),KEYBASE='vaulted_notes_v1:',TOKEN=localStorage.getItem('session_token');let uid='';try{uid=JSON.parse(atob(TOKEN.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub||''}catch{}if(!uid){document.body.innerHTML='<main style="padding:40px;color:var(--text)">Sign in to use Vaulted Notes.</main>';return}const KEY=KEYBASE+uid;let notes=[];try{notes=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(notes))notes=[]}catch{}let active='',filter='all',savedRange=null,saveTimer;
function rememberSelection(){const sel=getSelection();if(sel&&sel.rangeCount&&EDITOR.contains(sel.anchorNode))savedRange=sel.getRangeAt(0).cloneRange()}function restoreSelection(){EDITOR.focus();if(savedRange){const sel=getSelection();sel.removeAllRanges();sel.addRange(savedRange)}}function syncToolbar(){let sel=getSelection(),node=sel?.anchorNode;if(node?.nodeType===3)node=node.parentElement;let list=node?.closest?.('ul,ol'),block=node?.closest?.('p,h1,h2,h3,div,li,td,th'),align=block?getComputedStyle(block).textAlign:'left';if(align==='start')align='left';if(align==='end')align='right';document.querySelectorAll('[data-cmd]').forEach(btn=>{let cmd=btn.dataset.cmd,active=false;try{active=cmd==='justifyLeft'?align==='left':cmd==='justifyCenter'?align==='center':cmd==='justifyRight'?align==='right':cmd==='insertUnorderedList'?!!list&&list.tagName==='UL'&&!list.classList.contains('dash-list'):cmd==='insertOrderedList'?!!list&&list.tagName==='OL':cmd!=='removeFormat'&&document.queryCommandState(cmd)}catch{}btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active))});let dash=!!list&&list.classList.contains('dash-list'),check=!!node?.closest?.('.task'),table=!!node?.closest?.('table'),formatBlock=block?.tagName?.toLowerCase();for(const [id,on] of [['dashList',dash],['checkList',check],['table',table]]){let btn=document.getElementById(id);btn.classList.toggle('active',on);btn.setAttribute('aria-pressed',String(on))}if(formatBlock&&['p','h1','h2','h3'].includes(formatBlock))document.getElementById('format').value=formatBlock;let highlighter=document.querySelector('.color-tool');highlighter.classList.toggle('active',!!node?.closest?.('mark'))}document.addEventListener('selectionchange',()=>{rememberSelection();syncToolbar()});EDITOR.addEventListener('keyup',syncToolbar);EDITOR.addEventListener('mouseup',syncToolbar);EDITOR.addEventListener('input',syncToolbar);const safeHtml=html=>{const allowed=new Set(['P','BR','B','STRONG','I','EM','U','S','DEL','H1','H2','H3','UL','OL','LI','TABLE','THEAD','TBODY','TR','TD','TH','DIV','SPAN','MARK','LABEL','INPUT']);const doc=new DOMParser().parseFromString(html,'text/html');const walk=node=>{for(const el of [...node.children]){if(!allowed.has(el.tagName)){el.replaceWith(...el.childNodes);continue}for(const a of [...el.attributes]){if(el.tagName==='INPUT'&&a.name==='type'&&a.value==='checkbox')continue;if(a.name==='class'&&['dash-list','task'].includes(a.value))continue;if(el.tagName==='INPUT'&&a.name==='checked')continue;if(a.name==='style'&&/^(background-color:\s*#[\da-f]{3,8}|text-align:\s*(left|center|right))$/i.test(a.value.trim()))continue;el.removeAttribute(a.name)}walk(el)}};walk(doc.body);return doc.body.innerHTML};
const current=()=>notes.find(n=>n.id===active);function persist(){if(!active)return;const n=current();if(!n)return;n.title=TITLE.value.trim()||'New Note';n.html=safeHtml(EDITOR.innerHTML);n.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(notes))}catch{}document.getElementById('saveStatus').textContent='Saved';document.getElementById('statusLine').textContent='Saved on this device · private to your account';renderList()}
function scheduleSave(){document.getElementById('saveStatus').textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(persist,250)}function renderList(){let q=document.getElementById('search').value.toLowerCase();let rows=notes.filter(n=>(filter==='all'||n.pinned)&&(`${n.title} ${n.html.replace(/<[^>]*>/g,' ')}`).toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated);LIST.replaceChildren();for(const n of rows){const row=document.createElement('article');row.className='note-row'+(n.id===active?' selected':'');row.onclick=()=>openNote(n.id);const title=document.createElement('strong');title.textContent=n.title||'New Note';const time=document.createElement('time');time.textContent=new Date(n.updated).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});const preview=document.createElement('p');preview.textContent=n.html.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()||'No additional text';row.append(title,time,preview);LIST.append(row)}if(!rows.length){const e=document.createElement('p');e.className='empty';e.textContent=q?'No matching notes':'No notes yet';LIST.append(e)}document.getElementById('noteCount').textContent=notes.length;document.getElementById('pinnedCount').textContent=notes.filter(n=>n.pinned).length}
function openNote(id){persist();active=id;const n=current();if(!n)return;TITLE.value=n.title==='New Note'?'':n.title;EDITOR.innerHTML=safeHtml(n.html||'');document.getElementById('pinNote').textContent=n.pinned?'★':'☆';document.getElementById('saveStatus').textContent='Vaulted Notes';renderList()}
function createNote(){const n={id:crypto.randomUUID(),title:'New Note',html:'',updated:Date.now(),pinned:false};notes.unshift(n);active=n.id;TITLE.value='';EDITOR.innerHTML='';persist();renderList();EDITOR.focus()}
document.getElementById('newNote').onclick=createNote;TITLE.addEventListener('input',scheduleSave);EDITOR.addEventListener('input',scheduleSave);EDITOR.addEventListener('blur',persist);document.getElementById('search').addEventListener('input',renderList);document.getElementById('allFolder').onclick=()=>{filter='all';document.getElementById('allFolder').classList.add('active');document.getElementById('pinnedFolder').classList.remove('active');renderList()};document.getElementById('pinnedFolder').onclick=()=>{filter='pinned';document.getElementById('pinnedFolder').classList.add('active');document.getElementById('allFolder').classList.remove('active');renderList()};document.getElementById('deleteNote').onclick=()=>{if(!active)return;notes=notes.filter(n=>n.id!==active);active='';TITLE.value='';EDITOR.innerHTML='';try{localStorage.setItem(KEY,JSON.stringify(notes))}catch{}renderList();document.getElementById('saveStatus').textContent='Vaulted Notes'};document.getElementById('pinNote').onclick=()=>{const n=current();if(!n)return;n.pinned=!n.pinned;document.getElementById('pinNote').textContent=n.pinned?'★':'☆';persist()};
document.querySelectorAll('[data-cmd]').forEach(btn=>{btn.onmousedown=e=>e.preventDefault();btn.onclick=()=>{restoreSelection();document.execCommand(btn.dataset.cmd,false,null);scheduleSave();syncToolbar()}});document.getElementById('format').onchange=e=>{restoreSelection();document.execCommand('formatBlock',false,e.target.value);scheduleSave();syncToolbar()};document.getElementById('highlightColor').oninput=e=>{restoreSelection();document.execCommand('hiliteColor',false,e.target.value);scheduleSave();syncToolbar()};document.getElementById('dashList').onmousedown=e=>e.preventDefault();document.getElementById('dashList').onclick=()=>{restoreSelection();document.execCommand('insertHTML',false,'<ul class="dash-list"><li><br></li></ul>');scheduleSave();syncToolbar()};document.getElementById('checkList').onmousedown=e=>e.preventDefault();document.getElementById('checkList').onclick=()=>{restoreSelection();document.execCommand('insertHTML',false,'<div class="task"><input type="checkbox"><span>Task</span></div><div><br></div>');scheduleSave();syncToolbar()};document.getElementById('table').onmousedown=e=>e.preventDefault();document.getElementById('table').onclick=()=>{restoreSelection();document.execCommand('insertHTML',false,'<table><tbody><tr><th>Column 1</th><th>Column 2</th><th>Column 3</th></tr><tr><td><br></td><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td><td><br></td></tr></tbody></table><p><br></p>');scheduleSave();syncToolbar()};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();createNote()}});if(notes.length)openNote(notes.sort((a,b)=>b.updated-a.updated)[0].id);else createNote();
function syncTheme(){try{const p=parent.document.documentElement,root=document.documentElement;root.dataset.theme=p.dataset.theme||'rosewood';const style=parent.getComputedStyle(p);for(const k of ['--bg-base','--bg-1-base','--bg-2-base','--bg-3-base','--bg-4-base','--accent','--accent-2','--accent-glow','--text','--text-muted','--bright-text','--border','--border-2','--border-3','--border-4'])root.style.setProperty(k,style.getPropertyValue(k))}catch{}}syncTheme();try{new MutationObserver(syncTheme).observe(parent.document.documentElement,{attributes:true,attributeFilter:['data-theme','style']})}catch{}
})();
</script>
</body></html>
